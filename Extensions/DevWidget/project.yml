name: DevWidget
options:
  bundleIdPrefix: com.victor
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM: <your personal team id>   (free Apple ID works)
targets:
  DevWidgetHost:
    type: application
    platform: macOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victor.devwidget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
    dependencies:
      - target: DevWidgetExtension
        embed: true
  DevWidgetExtension:
    type: app-extension
    platform: macOS
    sources: [Widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victor.devwidget.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
